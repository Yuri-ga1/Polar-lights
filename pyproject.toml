[project]
name = "polar-lights"
version = "1.0.0"
description = ""
authors = [
    {name = "Yuri-ga1",email = "regota09@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "selenium (>=4.39.0,<5.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
    "cartopy (>=0.25.0,<0.26.0)",
    "ppigrf (>=2.1.0,<3.0.0)",
    "ionex @ git+https://github.com/gnss-lab/ionex.git",
    "unlzw3 (>=0.2.3,<0.3.0)",
    "aacgmv2 (>=2.7.1,<3.0.0)",
    "sunpy[map] (>=7.0,<8.0)",
    "astropy (>=6.1,<8.0)",
    "matplotlib (>=3.9,<4.0)",
    "numpy (>=2.0,<3.0)",
    "pillow (>=11.0,<13.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.14,<1.0)"
]
