# Static paths and CORS require a restart. Limits apply to new operations.
root = "files"
render_assets = "files/render-assets"
cors_origins = []
max_samples = 200000
max_cells = 1000000
max_points = 2000000
max_response_bytes = 67108864
max_days = 31
job_timeout = 1800
job_workers = 2
max_jobs = 32
# Long map/keogram/render stages; external generation has its own deadline.
long_job_timeout = 43200
job_max_attempts = 3
external_wait_timeout = 259200
